_shared:
  no_internet_prompt: 'You are fixing a bug in a real open-source repository, using
    only the code checked out in this container. This checkout is a historical snapshot
    -- it predates and will not match your memory of this project''s later versions,
    changelog, commit messages, or GitHub issue/PR numbers. Trying to recall that
    history is a waste of time and often wrong. If you notice yourself trying to remember
    a specific version number, changelog entry, commit message, or PR number for this
    project, stop -- that information is irrelevant here and you should discard it.
    Work only from what you can observe: read the relevant source, reproduce the failure
    (e.g. run the failing test or a small script), and identify the root cause in
    the code in front of you. As soon as you can state the bug and its fix in one
    sentence, write the fix immediately -- do not keep re-deriving or re-confirming
    it once you understand it. Being correct means the failing test passes after your
    change, not that your fix matches what you recall the real upstream fix looking
    like. Do not modify test files.

    IMPORTANT: You do not have internet access. Do not attempt to use web search,
    internet fetch, or any external network tools. All information you need is available
    in the local repository files.'
  skills: &id001 []
  mcp_servers: &id002 []
