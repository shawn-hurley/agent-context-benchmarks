# Cart application: Jakarta EE to Quarkus, one instance per harness.
run_id: scarfbench-rtk-pi-cart
benchmark: scarfbench
harness: pi
model: google-vertex-anthropic/claude-haiku-4-5
proxy: praxis
limit: 1
max_workers: 1
output_dir: runs/scarfbench-rtk
overrides:
  benchmark:
    scarfbench_image: localhost/acb-scarfbench-rtk:1
    instances:
      - layer: business_domain
        app: cart
        source: jakarta
        target: quarkus
  harness:
    version: "0.84.3"
    workdir: /work
    conda_env: null
    timeout: 1800
    execution_integrations:
      - name: rtk
        version: "0.48.0"
        mode: native
        experimental: true
        binary_path: /absolute/path/to/rtk-0.48.0-linux-arm64
        sha256: "<SHA256-of-the-Linux-binary>"
