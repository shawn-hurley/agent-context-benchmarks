swebench:
  dataset: SWE-bench/SWE-bench_Verified
  split: test
  patch_exclude_patterns:
  - .goosehints
  - .rgctl
  - .rgctl/**
  - .aider*
  - .cursor*
  - '*.swp'
  - '*.swo'
  - .DS_Store
  image_arch: auto
  task_repo: SWE-bench/swe-bench-tasks
swebench-lite:
  dataset: SWE-bench/SWE-bench_Lite
  split: test
  image_arch: auto
  task_repo: SWE-bench/swe-bench-tasks
  patch_exclude_patterns:
  - .goosehints
  - .rgctl
  - .rgctl/**
  - .aider*
  - .cursor*
  - '*.swp'
  - '*.swo'
  - .DS_Store
scarfbench:
  source: jakarta
  target: quarkus
