# Benchmark registry.

swebench:
  # NOTE: SWE-bench/SWE-bench_Verified, not princeton-nlp/SWE-bench_Verified.
  # The vendored harness (v5.0.2, task-repo architecture) requires each
  # instance to carry `image`/`eval_script`/`log_parser`/`eval_type` fields
  # (swebench/harness/utils.py make_test_spec(), no fallback -- KeyError
  # without them). princeton-nlp's dataset predates this schema and lacks
  # those columns entirely; SWE-bench/SWE-bench_Verified has them. Confirmed
  # via the HF datasets-server schema for both.
  dataset: SWE-bench/SWE-bench_Verified
  split: test
  max_workers: 4
  # Container backend for evaluation. "auto" uses DOCKER_HOST if set, else a
  # running Podman machine's socket, else the docker default.
  container_backend: auto        # auto | podman | docker
  # docker_host: unix:///path/to.sock   # explicit override if needed
  # namespace: ""                # set "" to build images locally (e.g. arm64
  #                              # Macs where prebuilt x86_64 images are absent)

  # --- Container-mode generation (the only mode -- see acb/runner.py) ----
  # The harness runs *inside* the same SWE-bench eval image evaluation will
  # grade the patch in (built on demand from the task repo -- see
  # acb/benchmarks/image_builder.py), so its dev environment matches
  # evaluation exactly. Requires Podman. All four harnesses (goose, claude-code,
  # opencode, pi) support container mode today (HarnessAdapter.run_container()).
  image_arch: auto                 # auto | amd64 | arm64 (auto = host arch)
  task_repo: SWE-bench/swe-bench-tasks   # source of per-instance Dockerfiles
  # The praxis-ai image (acb-praxis-ai:latest) is built automatically from
  # the Containerfile at the repo root when the image is absent.  That
  # Containerfile is self-contained: it clones praxis-proxy/ai at a pinned
  # commit and compiles the praxis-vertex-anthropic filter in -- no external
  # checkout required.
  #
  # praxis_ai_repo is an optional override for development: point it at a
  # local checkout of https://github.com/praxis-proxy/ai (must have its own
  # Containerfile) to build from a modified upstream tree instead.
  #
  # praxis_ai_repo: /path/to/praxis-proxy/ai

swebench-lite:
  # SWE-bench Lite: 534 curated instances for faster iteration.
  # Uses the same SWEBench adapter as `swebench` above, just with a different dataset.
  dataset: SWE-bench/SWE-bench_Lite
  split: test
  max_workers: 4
  container_backend: auto
  image_arch: auto
  task_repo: SWE-bench/swe-bench-tasks

livecodebench:
  # Stub - benchmark adapter not yet implemented (see acb/benchmarks/stubs.py)
  {}

scarfbench:
  # Implemented - requires `scarf` CLI and `scarf bench pull` setup.
  # See acb/benchmarks/scarfbench.py for configuration details.
  # Example minimal config:
  #   benchmark_cache_dir: /path/to/scarf-bench-output
  #   scarf_binary: scarf  # or full path
  #   instances:
  #     - layer: business_domain
  #       app: cart
  #       source: jakarta
  #       target: quarkus
  {}
