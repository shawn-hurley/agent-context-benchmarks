[project]
name = "agent-context-benchmarks"
version = "0.1.0"
description = "Measure context/token usage across agent harnesses on coding benchmarks"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "google-auth>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# needed to load SWE-bench (and other HF-hosted) datasets
datasets = ["datasets>=2.16"]

[project.scripts]
acb = "acb.cli:main"

[tool.setuptools.packages.find]
include = ["acb*"]

[tool.setuptools.package-data]
"acb" = ["goose-container-config.yaml", "goosehints-templates/*.md"]
"acb.integrations" = ["assets/rtk/*.mjs", "assets/rtk/*.ts", "assets/rtk/*.py"]
"acb.harnesses" = ["assets/*.json"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
