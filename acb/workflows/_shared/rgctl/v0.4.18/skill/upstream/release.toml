# cargo-release config — lockstep workspace version + git tag for GH Release workflow.
# Docs: https://github.com/crate-ci/cargo-release
#
# Dry-run (default):  cargo release patch --workspace
# Execute:            cargo release patch --workspace --execute
# Explicit version:   cargo release 0.4.18 --workspace --execute
#
# Binary releases are built by `.github/workflows/release.yml` on `v*` tags.
# Crates.io publish is off until we intentionally enable it.

# All publishable members share one version (matches `[workspace.package].version`).
shared-version = true

# When bumping, upgrade in-workspace path dependency `version =` requirements.
dependent-version = "upgrade"

# One commit for the whole workspace bump.
consolidate-commits = true

# Tag shape matches existing GH Actions trigger (`on.push.tags: v*`).
# Shared-version workspaces tag once as `v{{version}}`.
tag-name = "v{{version}}"
tag-prefix = ""

# Do not cargo-publish on release (GH binary artifacts only for now).
publish = false

# Push tags so the Release workflow runs (requires --execute).
push = true
push-remote = "origin"

# Branches allowed for --execute (globs ok).
allow-branch = ["*"]

# Exclude dogfood / fixture crates (not workspace members, listed for safety).
# exclude = []

# README latest-release link: updated by ./scripts/bump-version.sh (not
# cargo-release replacements — those apply per-crate and break on missing
# crates/*/README.md).
