  skills_dir: /opt/acb/skills
  dockerfile_append: 'COPY skills/ /opt/acb/skills/


    COPY provenance.json /opt/acb/provenance.json

    COPY rgctl-plan.sh /opt/acb/rgctl-plan.sh

    RUN chmod +x /opt/acb/rgctl-plan.sh

    '
steps:
- name: plan
  instruction: steps/plan.md
  timeout_sec: 900
  gate:
    type: artifacts
    evidence_dir: migiq-plan
    archive:
    - migiq-workspace/
    - mig-prompt-workspace/
    - mig-plan-workspace/
    required:
    - migiq-workspace/analysis/analysis.ok
    - migiq-workspace/analysis/status.json
    - mig-prompt-workspace/migration-prompt.md
    - mig-plan-workspace/tasks.md
    - mig-plan-workspace/UserStory.md
- name: execute
  instruction: steps/execute.md
  timeout_sec: 900
  gate:
    type: artifacts
    evidence_dir: migiq-execute
    archive:
    - mig-plan-workspace/
    - mig-execute-workspace/
    - migiq-workspace/
    required:
    - mig-execute-workspace/EXECUTION_REPORT.md
- name: verify
  instruction: steps/verify.md
  timeout_sec: 900
  gate:
    type: native
    evidence_dir: migiq-final
    archive:
    - migiq-workspace/
    - mig-plan-workspace/
    - mig-execute-workspace/
    required:
    - migiq-workspace/MIGRATION_REPORT.md
exclude_from_grading:
- .rgctl
- migiq-workspace
- mig-prompt-workspace
- mig-plan-workspace
- mig-execute-workspace
- mig-test-workspace
- mig-containerize-workspace
- mig-deploy-workspace
- .goosehints
